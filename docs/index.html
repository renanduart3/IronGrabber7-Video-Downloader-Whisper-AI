        };

        const baseUrl = "https://renanduart3.github.io/IronGrabber7-Video-Downloader-Whisper-AI/img/";

        function setLang(lang) {
            // Atualiza os textos
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[lang][key]) el.innerHTML = dict[lang][key];
            });

            // Atualiza as imagens de forma dinâmica baseada no idioma
            let openGraphImg = lang === 'pt' ? 'open-graph-pt.png' : (lang === 'es' ? 'open-graph-es.png' : 'open-graph-en.png');
            let factImg = lang === 'pt' ? 'fact-pt.png' : (lang === 'es' ? 'fact-es.png' : 'fact-en.png');
            let posImg = lang === 'pt' ? 'pos-pt.png' : (lang === 'es' ? 'pos-es.png' : 'pos-en.png');
            
            // Caso a imagem ptbr original seja a .jpg que você enviou antes, descomente a linha abaixo:
            if (lang === 'pt') openGraphImg = 'open-graph.jpg'; 

            document.getElementById('hero-img').src = baseUrl + openGraphImg;
            document.getElementById('fact-img').src = baseUrl + factImg;
            document.getElementById('pos-img').src = baseUrl + posImg;

            // Esconde os botões e mostra só o correto (quando for reativar o pagamento)
            document.getElementById('btn-en').classList.add('hidden');
            document.getElementById('btn-pt').classList.add('hidden');
            document.getElementById('btn-es').classList.add('hidden');
        }

        const userLang = navigator.language || navigator.userLanguage;
        if (userLang && userLang.includes('pt')) setLang('pt');
        else if (userLang && userLang.includes('es')) setLang('es');
        else setLang('en');
    </script>

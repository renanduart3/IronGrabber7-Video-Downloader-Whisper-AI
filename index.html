    <script>

                'f1_title': '🧠 Local Whisper AI',
                'f1_desc': 'Transcribe any video/audio directly on your hardware. No cloud limits, no data harvesting. It just works offline.',
                'f2_title': '✂️ Surgical Cuts',
                'f2_desc': 'Don\'t download a 3-hour podcast for a 10-second clip. Input the timestamp, and we rip only what you need.',
                'f3_title': '🍪 Cookie ByPass',
                'f3_desc': 'Private Twitter videos? Age-restricted YouTube? If your Chrome browser can see it, IronGrabber7 can extract it.',
                'f4_title': '💀 Pay Once. Own it.',
                'f4_desc': 'The SaaS subscription model is a scam. Pay once, download the .exe, and run it on your machine until the end of time.'
            },
            'pt': {
                'hero_title': 'Extraia &amp; Transcreva.<br><span class="text-red-500">Sem Nuvem. Sem Mensalidades.</span>',
                'hero_sub': 'Pare de alugar ferramentas. O IronGrabber7 é um extrator brutal para desktop movido por IA local (Whisper). Baixe mídias privadas, transcreva offline e corte áudio cirurgicamente. O software é seu, e ponto final.',
                'f1_title': '🧠 IA Whisper Local',
                'f1_desc': 'Transcreva qualquer vídeo/áudio direto no seu hardware. Sem limites de nuvem, sem roubo de dados. Processamento 100% offline.',
                'f2_title': '✂️ Cortes Cirúrgicos',
                'f2_desc': 'Não baixe um podcast de 3 horas por causa de 10 segundos. Digite o tempo de início/fim, e nós arrancamos só o que você precisa.',
                'f3_title': '🍪 ByPass de Cookies',
                'f3_desc': 'Vídeo privado no X/Twitter? YouTube +18? Se o seu navegador Chrome consegue ver logado, o IronGrabber7 consegue extrair.',
                'f4_title': '💀 Pague Uma Vez. É Seu.',
                'f4_desc': 'O modelo de assinaturas é um roubo. Pague R$ 77 uma vez, baixe o arquivo .exe e rode na sua máquina para sempre.'
            },
            'es': {
                'hero_title': 'Extrae &amp; Transcribe.<br><span class="text-red-500">Cero Nube. Cero Suscripciones.</span>',
                'hero_sub': 'Deja de alquilar herramientas. IronGrabber7 es un extractor brutal de escritorio impulsado por IA local (Whisper). Descarga medios privados, transcribe offline y corta audio quirúrgicamente.',
                'f1_title': '🧠 IA Whisper Local',
                'f1_desc': 'Transcribe cualquier video/audio directamente en tu hardware. Sin límites de nube, sin recolección de datos. Funciona 100% offline.',
                'f2_title': '✂️ Cortes Quirúrgicos',
                'f2_desc': 'No descargues un podcast de 3 horas por un clip de 10 segundos. Ingresa el tiempo y arrancamos solo lo que necesitas.',

            }
        };

        function setLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerHTML = dict[lang][key];
            });

            document.getElementById('btn-en').classList.add('hidden');
            document.getElementById('btn-pt').classList.add('hidden');
            document.getElementById('btn-es').classList.add('hidden');

            document.getElementById('btn-' + lang).classList.remove('hidden');
            document.getElementById('btn-' + lang).classList.add('block');
        }

        const userLang = navigator.language || navigator.userLanguage;
        if (userLang.includes('pt')) setLang('pt');
        else if (userLang.includes('es')) setLang('es');
        else setLang('en');
    </script>
</body>
</html>
